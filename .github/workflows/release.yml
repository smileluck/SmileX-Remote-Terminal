# 三平台安装包构建：push v* tag 触发，产物自动挂到 GitHub Release
# macOS 出 universal(arm64+x86_64) dmg；Windows 出 msi + nsis exe；Linux 出 deb + AppImage
name: release

on:
  push:
    tags: ['v*']

# tauri-action 创建 Release / 上传产物需要写权限（仓库默认 token 为只读时必须显式声明）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 不指定 version：从根 package.json 的 packageManager 字段读取（pnpm@8.15.0）
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux 系统依赖（WebKitGTK 等）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 显式传 tag 名：自动探测失败时会跳过上传（job 仍绿但 release 为空）
          tagName: ${{ github.ref_name }}
          releaseName: 'SmileX Remote Terminal ${{ github.ref_name }}'
          # macOS 打 universal 包；其他平台用默认 target
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          # 直接发布正式 release（默认是草稿，容易误以为没生成）
          releaseDraft: false
