[package]
name = "smilex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SmileX 桌面应用（Tauri）：整合 SSH + 远程桌面 + AI 助手"

[lib]
name = "smilex_desktop"
path = "src/lib.rs"

[[bin]]
name = "smilex-remote-terminal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# workspace 依赖
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

# 领域核心
ssh-core = { path = "../ssh-core" }
remote-desktop-core = { path = "../remote-desktop-core" }
ai-core = { path = "../ai-core" }
# russh（desktop 需要 russh::ChannelId 类型用于 sessionId → channel_id 映射）
russh = { workspace = true }

# Tauri（默认 feature 集，避免与 tauri.conf.json 的 allowlist 冲突）
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# 存储
rusqlite = { version = "0.31", features = ["bundled"] }
# keyring v3 平台后端按 feature 启用；不开任何 feature 时各平台都退化为
# 进程内 mock 存储（重启即丢密码），必须显式启用目标平台的原生后端。
# 注意：现已改为本地加密 vault 存储凭据，keyring 仅用于读取历史数据迁移。
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
# 凭据本地加密存储（AES-256-GCM）：dev 构建为 ad-hoc 签名，每次重编译 code
# identity 变化，macOS Keychain 每次读取都弹系统授权框，开发期不可用
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# 时间戳（SessionProfile.created_at / last_used_at）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 本地目录定位（SFTP 下载保存到 ~/Downloads）
dirs = "5"

# 日志
log = "0.4"

[features]
# 默认包含自定义协议
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
