[package]
name = "smilex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SmileX 桌面应用（Tauri）：整合 SSH + 远程桌面 + AI 助手"

[lib]
name = "smilex_desktop"
path = "src/lib.rs"

[[bin]]
name = "smilex-remote-terminal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# workspace 依赖
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

# 领域核心
ssh-core = { path = "../ssh-core" }
remote-desktop-core = { path = "../remote-desktop-core" }
ai-core = { path = "../ai-core" }
# russh（desktop 需要 russh::ChannelId 类型用于 sessionId → channel_id 映射）
russh = { workspace = true }

# Tauri（默认 feature 集，避免与 tauri.conf.json 的 allowlist 冲突）
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# 存储
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "3"
# 时间戳（SessionProfile.created_at / last_used_at）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 日志
log = "0.4"

[features]
# 默认包含自定义协议
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
